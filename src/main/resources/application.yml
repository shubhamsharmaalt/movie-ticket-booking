spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  hold-minutes: 5
  admin-password: ${APP_ADMIN_PASSWORD:adminpass}
  alice-password: ${APP_ALICE_PASSWORD:alicepass}
  bob-password: ${APP_BOB_PASSWORD:bobpass}
